# GitHub Pages: the guide (docs/rx-android.*.md -> HTML) and the firmware of both boards for the web flasher (ESP Web Tools)
# and the app's Firmware screen: the ESP32-S3 receiver from the ESP32-DATV-RX submodule (checked against its SHA256SUMS),
# the ESP32-C3 transmitter built here from the ESP32-DATV-SA submodule (tx/build_c3_web.sh); manifests by tx/make_fw_site.py.
name: Pages

on:
  push:
    branches: [master]
    paths: ['site/**', 'docs/rx-android.*', 'docs/img/**', 'third_party/ESP32-DATV-RX', 'third_party/ESP32-DATV-SA',
            'tx/build_c3_web.sh', 'tx/make_fw_site.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  c3:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - name: ESP32-C3 transmitter firmware
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git -C third_party/ESP32-DATV-SA fetch --tags -q || true
          apt-get update -q > /dev/null && apt-get install -y -q rsync > /dev/null
          . $IDF_PATH/export.sh > /dev/null
          tx/build_c3_web.sh "$PWD/c3-out"
      - uses: actions/upload-artifact@v4
        with:
          name: c3-firmware
          path: c3-out

  build:
    needs: c3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: c3-firmware
          path: c3-out
      - name: Site
        run: |
          sudo apt-get install -y -q pandoc > /dev/null
          mkdir -p public && cp -r site/* public/
          mkdir -p public/img && cp docs/img/*.png public/img/ 2>/dev/null || true
          for l in cs en; do
            pandoc "docs/rx-android.$l.md" -s --metadata lang=$l --css style.css \
              --metadata pagetitle="ATV RX/TX – $([ $l = cs ] && echo návod || echo guide)" -o "public/$l.html"
          done
          fw=third_party/ESP32-DATV-RX/firmware
          (cd "$fw" && sha256sum -c --ignore-missing SHA256SUMS)
          python3 tx/make_fw_site.py public/flasher --c3 c3-out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
